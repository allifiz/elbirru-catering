name: Format source
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/format-source.yml'
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - run: npx --yes prettier@3.6.2 --write "app/**/*.{ts,tsx,css}" "components/**/*.tsx" "data/**/*.{ts,json}" "scripts/**/*.mjs" "*.json" "*.ts" "*.mjs" README.md
      - run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components data scripts '*.json' '*.ts' '*.mjs' README.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format source with Prettier"
            git push origin HEAD:main
          fi
