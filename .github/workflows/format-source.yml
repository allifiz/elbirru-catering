name: Format source
on:
  workflow_dispatch:
  push:
    branches:
      - preview-2
    paths:
      - '.github/workflows/format-source.yml'
      # Manual formatting remains scoped to preview-2.
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: preview-2
      - run: npx --yes prettier@3.6.2 --write app components data scripts
      - run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components data scripts
          if ! git diff --cached --quiet; then
            git commit -m "style: format editorial preview"
            git push origin HEAD:preview-2
          fi
